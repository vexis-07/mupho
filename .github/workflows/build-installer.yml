name: Build Windows installer
on:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "preload.js"
      - "renderer.js"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "logo.*"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installer
        run: npm run build
      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: main
          name: OutFix Player 1.0.1
          make_latest: true
          overwrite_files: true
          files: dist/OutFix-Player-Setup-1.0.1.exe
